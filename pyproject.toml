[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hello_agents"]

[project]
name = "hello-agents"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dashscope>=1.27.6",
    "docstring-parser>=0.18.0",
    "mcp>=2.3.0",
    "openai>=3.16.2",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "serpapi>=1.1.1",
    "tavily>=1.1.0",
    "tiktoken>=0.14.0",
]

[project.optional-dependencies]
qdrant = ["qdrant-client>=1.9"]
neo4j = ["neo4j>=5.20"]
dashscope = ["dashscope>=1.20"]
rag = ["pypdf>=4.0", "python-docx>=1.1"]
local = ["sentence-transformers>=3.0"]
all = [
    "qdrant-client>=1.9",
    "neo4j>=5.20",
    "dashscope>=1.20",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "sentence-transformers>=3.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.8",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# 默认排除需要外部进程/网络的集成测试；显式打开：uv run pytest -m integration
addopts = "-m 'not integration'"
markers = [
    "e2e: 端到端测试，发真实网络请求并产生费用；默认跳过，用 RUN_MODEL_E2E=1 打开",
    "integration: 需要外部进程/网络的集成测试，默认不跑；用 -m integration 打开",
]
